
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EAF6FC">
<title>勤務パターン抽選</title>

<style>
:root {
  --bg: #EAF6FC;
  --text: #34505F;
  --border: #9CCFE8;
  --blue: #55A9D1;
  --blue-dark: #347FA6;
  --first-bg: #DDF2FC;
  --second-bg: #FFF0D9;
  --second-text: #805A28;
  --white: #FFFFFF;
  --shadow: 0 5px 16px rgba(52,80,95,.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 14px 36px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", "Yu Gothic", Meiryo, sans-serif;
}

button, input { font: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

.app {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

header {
  text-align: center;
  margin-bottom: 22px;
}

h1 {
  margin: 13px 0 6px;
  font-size: 27px;
  letter-spacing: 1px;
}

.subtitle {
  margin: 0;
  font-size: 13px;
  opacity: .75;
}

.panel {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 19px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 15px;
  font-size: 17px;
  font-weight: 800;
}

.section-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 31px;
  height: 31px;
  border-radius: 10px;
  background: var(--first-bg);
  font-size: 17px;
}

.attendance-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #F4FAFD;
  font-size: 12px;
  margin-bottom: 14px;
}

.attendance-summary strong { font-size: 15px; }

.pattern-info {
  color: #688694;
  text-align: right;
  font-size: 11px;
}

.member-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.member-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.member-number {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 30px;
  height: 32px;
  border-radius: 10px;
  background: var(--first-bg);
  font-size: 12px;
  font-weight: 800;
}

.member-role {
  display: block;
  margin-top: 2px;
  font-size: 10px;
  color: #668391;
  font-weight: 500;
}

.member-input {
  width: 100%;
  min-width: 0;
  height: 43px;
  padding: 0 10px;
  border: 1px solid #D5E6EE;
  border-radius: 11px;
  outline: none;
  color: var(--text);
  background: #FBFDFF;
}

.member-input:focus {
  border-color: var(--blue);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(85,169,209,.12);
}

.member-input::placeholder { color: #A3B5BE; }

.status-btn {
  flex-shrink: 0;
  width: 76px;
  min-height: 40px;
  border: 1px solid #A7D7B9;
  border-radius: 12px;
  background: #E5F7EA;
  color: #287346;
  font-size: 12px;
  font-weight: 800;
  transition: transform .12s, background .15s;
}

.status-btn:active { transform: scale(.94); }

.status-btn.off {
  border-color: #D8DDE1;
  background: #F0F2F4;
  color: #7A858C;
}

.status-symbol { margin-right: 3px; }

.save-status {
  margin: 12px 0 0;
  min-height: 16px;
  text-align: right;
  color: #6C929F;
  font-size: 11px;
}

.draw-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 65px;
  margin: 20px 0 18px;
  border: none;
  border-radius: 18px;
  color: var(--white);
  background: linear-gradient(135deg,#57B6DE,#398DBA);
  box-shadow: 0 6px 0 #28759F,
    0 10px 18px rgba(52,127,166,.18);
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
  transition: transform .12s, box-shadow .12s;
}

.draw-button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #28759F;
}

.draw-button:disabled {
  opacity: .6;
  cursor: wait;
}

.draw-icon { font-size: 26px; }

.result { display: none; }

.result.show {
  display: block;
  animation: appear .35s ease-out;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-heading {
  text-align: center;
  margin-bottom: 17px;
}

.result-heading h2 {
  margin: 0 0 5px;
  font-size: 22px;
}

.result-heading p {
  margin: 0;
  font-size: 12px;
  opacity: .7;
}

.result-group {
  padding: 17px;
  margin-bottom: 13px;
  border-radius: 17px;
}

.result-group.first {
  background: var(--first-bg);
  border: 1px solid #B8DFF1;
}

.result-group.second {
  background: var(--second-bg);
  border: 1px solid #F0D9B2;
}

.group-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
}

.group-title {
  font-size: 18px;
  font-weight: 900;
}

.first .group-title { color: var(--blue-dark); }
.second .group-title { color: var(--second-text); }

.group-count {
  padding: 5px 10px;
  border-radius: 20px;
  background: rgba(255,255,255,.8);
  font-size: 12px;
  font-weight: 800;
}

.result-members {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 9px;
}

.result-member {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 51px;
  padding: 10px 6px;
  border-radius: 12px;
  background: var(--white);
  font-size: 17px;
  font-weight: 800;
  overflow-wrap: anywhere;
  text-align: center;
  box-shadow: 0 2px 5px rgba(52,80,95,.05);
}

.result-member.leader {
  grid-column: 1 / -1;
  border: 1px solid #9CCFE8;
  background: #FFFFFF;
}

.result-group.first .result-member { color: var(--blue-dark); }
.result-group.second .result-member { color: var(--second-text); }

.again-note {
  text-align: center;
  margin: 12px 0 0;
  font-size: 12px;
  opacity: .65;
}

@media (max-width: 360px) {
  body { padding: 15px 10px 28px; }
  .panel { padding: 15px; }
  h1 { font-size: 24px; }
  .member-row { gap: 5px; }
  .member-number { width: 26px; }
  .status-btn { width: 68px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <h1>🎲 勤務パターン抽選</h1>
    <p class="subtitle">出勤メンバーを選んで、決定!</p>
  </header>

  <section class="panel">
    <h2 class="section-title">
      <span class="section-icon">👥</span>
      本日の出勤メンバー
    </h2>

    <div class="attendance-summary">
      <div>出勤人数:<strong id="countNumber">8人</strong></div>
      <div class="pattern-info" id="patternInfo">前半5人/後半3人</div>
    </div>

    <div class="member-list" id="memberList"></div>

    <p class="save-status" id="saveStatus" aria-live="polite">
      設定は自動保存されます
    </p>
  </section>

  <button type="button" class="draw-button" id="drawBtn">
    <span class="draw-icon">🎲</span>
    決定!
  </button>

  <section class="panel result" id="result" aria-live="polite">
    <div class="result-heading">
      <h2>✨ 抽選結果</h2>
      <p id="resultDescription">今回の勤務パターンが決まりました</p>
    </div>

    <div class="result-group first">
      <div class="group-heading">
        <span class="group-title">☀️ 前半</span>
        <span class="group-count" id="firstCount">5人</span>
      </div>
      <div class="result-members" id="firstMembers"></div>
    </div>

    <div class="result-group second">
      <div class="group-heading">
        <span class="group-title">🌙 後半</span>
        <span class="group-count" id="secondCount">3人</span>
      </div>
      <div class="result-members" id="secondMembers"></div>
    </div>

    <p class="again-note">もう一度「決定!」を押すと再抽選できます</p>
  </section>
</div>

<script>
"use strict";

const STORAGE_KEY = "kinmu_settings_v2";
const OLD_STORAGE_KEY = "mocataro_kinmu_settings_v1";

const DEFAULT_NAMES = [
  "田中",
  "佐藤",
  "鈴木",
  "高橋",
  "伊藤",
  "メンバー6",
  "メンバー7",
  "メンバー8"
];

let names = [...DEFAULT_NAMES];
let working = Array(8).fill(true);

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

// 設定の読み込み。以前の5人版からも引き継ぐ
function loadSettings() {
  try {
    let saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      saved = localStorage.getItem(OLD_STORAGE_KEY);
    }

    if (!saved) return;

    const data = JSON.parse(saved);

    if (Array.isArray(data.names)) {
      data.names.forEach((name, i) => {
        if (i < 8 && typeof name === "string") {
          names[i] = name.slice(0, 40);
        }
      });
    }

    if (
      Array.isArray(data.working) &&
      data.working.length === 8 &&
      data.working.every(value => typeof value === "boolean")
    ) {
      working = [...data.working];
    } else if (
      Array.isArray(data.working) &&
      data.working.length === 5
    ) {
      // 5人版の出勤設定を引き継ぎ、新しい3人は出勤にする
      working = [
        ...data.working,
        true, true, true
      ];
    } else if (data.attendance === 4 || data.attendance === 5) {
      working = names.map((_, i) => i < data.attendance);
      working[5] = true;
      working[6] = true;
      working[7] = true;
    }
  } catch (error) {
    console.warn("設定を読み込めませんでした。", error);
  }
}

function saveSettings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      names,
      working
    }));

    document.getElementById("saveStatus").textContent =
      "✓ 設定を保存しました";
  } catch (error) {
    document.getElementById("saveStatus").textContent =
      "保存できません。ブラウザの設定をご確認ください。";
  }
}

function getWorkingMembers() {
  return names.map((name, index) => ({
    name: name.trim(),
    index,
    working: working[index]
  })).filter(member => member.working);
}

function updateAttendance() {
  const count = working.filter(Boolean).length;
  document.getElementById("countNumber").textContent = count + "人";

  if (count >= 6) {
    document.getElementById("patternInfo").textContent =
      `前半${count - 3}人/後半3人`;
  } else {
    document.getElementById("patternInfo").textContent =
      "出勤6人以上が必要";
  }

  document.getElementById("result").classList.remove("show");
}

function renderMemberInputs() {
  const list = document.getElementById("memberList");

  list.innerHTML = names.map((name, index) => {
    const isWorking = working[index];
    let role = "";

    if (index === 0) role = "責任者";
    else if (index === 1 || index === 2) role = "副責任者";

    return `
      <div class="member-row">
        <span class="member-number">${index + 1}</span>

        <input
          class="member-input"
          type="text"
          maxlength="40"
          autocomplete="off"
          aria-label="メンバー${index + 1}の名前"
          placeholder="メンバー${index + 1}"
          value="${escapeHTML(name)}"
          data-index="${index}"
        >

        <button
          type="button"
          class="status-btn ${isWorking ? "" : "off"}"
          data-index="${index}"
          aria-pressed="${isWorking}"
          aria-label="${escapeHTML(name || `メンバー${index + 1}`)}:${isWorking ? "出勤" : "休み"}。タップで切り替え"
        >
          <span class="status-symbol">${isWorking ? "●" : "-"}</span>${isWorking ? "出勤" : "休み"}
        </button>
      </div>
      ${role ? `<div style="margin:-7px 0 0 39px;font-size:10px;color:#668391">${role}</div>` : ""}
    `;
  }).join("");

  list.querySelectorAll(".member-input").forEach(input => {
    input.addEventListener("input", event => {
      const index = Number(event.target.dataset.index);
      names[index] = event.target.value;
      saveSettings();
      updateAttendance();
    });
  });

  list.querySelectorAll(".status-btn").forEach(button => {
    button.addEventListener("click", event => {
      const index = Number(event.currentTarget.dataset.index);
      working[index] = !working[index];
      renderMemberInputs();
      updateAttendance();
      saveSettings();
    });
  });
}

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

// 指定人数の前半・後半を作成
function makeAssignment(active) {
  const frontCount = active.length - 3;

  const leader = active.find(member => member.index === 0);
  const deputy2 = active.find(member => member.index === 1);
  const deputy3 = active.find(member => member.index === 2);

  const front = [];
  const back = [];
  const assigned = new Set();

  function addFront(member) {
    if (member && !assigned.has(member.index)) {
      front.push(member);
      assigned.add(member.index);
    }
  }

  function addBack(member) {
    if (member && !assigned.has(member.index)) {
      back.push(member);
      assigned.add(member.index);
    }
  }

  // 1番の責任者は出勤時、前半固定
  if (leader) addFront(leader);

  // 副責任者の配置ルール
  if (deputy2 && deputy3) {
    // 2人とも出勤なら前半・後半に1人ずつ
    // 1番が休みの場合も前半担当をランダムにする
    const pair = shuffle([deputy2, deputy3]);

    addFront(pair[0]);
    addBack(pair[1]);
  } else if (deputy2 || deputy3) {
    // 片方だけ出勤なら、その人は後半固定
    addBack(deputy2 || deputy3);
  }

  // 4〜8番の出勤者をランダムに並べる
  const general = shuffle(
    active.filter(member =>
      member.index >= 3 && !assigned.has(member.index)
    )
  );

  // 前半の必要人数を埋める
  while (front.length < frontCount && general.length > 0) {
    addFront(general.shift());
  }

  // 残りは後半へ
  while (general.length > 0) {
    addBack(general.shift());
  }

  // 1番は前半の先頭に固定。
  // それ以外の前半メンバーの表示順をランダムにする。
  const fixedLeader = front.find(member => member.index === 0);
  const frontOthers = shuffle(
    front.filter(member => member.index !== 0)
  );

  const finalFront = fixedLeader
    ? [fixedLeader, ...frontOthers]
    : frontOthers;

  // 後半は全員、表示順もランダム
  const finalBack = shuffle(back);

  return { front: finalFront, back: finalBack };
}

function drawMembers() {
  const active = getWorkingMembers();

  if (active.length < 6) {
    alert("出勤人数が6人未満です。\n出勤者を6人以上にしてください。");
    return;
  }

  const empty = active.find(member => !member.name);

  if (empty) {
    alert(`メンバー${empty.index + 1}の名前が空欄です。`);
    const input = document.querySelector(
      `.member-input[data-index="${empty.index}"]`
    );
    if (input) input.focus();
    return;
  }

  const seen = new Set();

  for (const member of active) {
    if (seen.has(member.name)) {
      alert(`「${member.name}」が重複しています。\n名前を確認してください。`);
      const input = document.querySelector(
        `.member-input[data-index="${member.index}"]`
      );
      if (input) input.focus();
      return;
    }
    seen.add(member.name);
  }

  const { front, back } = makeAssignment(active);

  document.getElementById("firstCount").textContent =
    front.length + "人";

  document.getElementById("secondCount").textContent =
    back.length + "人";

  document.getElementById("resultDescription").textContent =
    `出勤${active.length}人からランダムに抽選しました`;

  document.getElementById("firstMembers").innerHTML =
    front.map(member => `
      <div class="result-member ${member.index === 0 ? "leader" : ""}">
        ${escapeHTML(member.name)}${member.index === 0 ? " 👑" : ""}
      </div>
    `).join("");

  document.getElementById("secondMembers").innerHTML =
    back.map(member => `
      <div class="result-member">
        ${escapeHTML(member.name)}
      </div>
    `).join("");

  const result = document.getElementById("result");
  result.classList.remove("show");
  void result.offsetWidth;
  result.classList.add("show");

  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

document.getElementById("drawBtn")
  .addEventListener("click", drawMembers);

loadSettings();
renderMemberInputs();
updateAttendance();
</script>
</body>
</html>
